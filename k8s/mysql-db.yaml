apiVersion: v1
kind: ConfigMap
metadata:
  name: movie-init-sql
data:
  movie_rest_dump.sql: |
    -- PostgreSQL database dump
    SET statement_timeout = 0;
    SET lock_timeout = 0;
    SET idle_in_transaction_session_timeout = 0;
    SET client_encoding = 'UTF8';
    SET standard_conforming_strings = on;
    SELECT pg_catalog.set_config('search_path', '', false);
    SET check_function_bodies = false;
    SET xmloption = content;
    SET client_min_messages = warning;
    SET row_security = off;

    SET default_tablespace = '';
    SET default_table_access_method = heap;

    -- Name: actors; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.actors (
        id bigint NOT NULL,
        name character varying(100),
        photo_base64 text
    );

    ALTER TABLE public.actors OWNER TO postgres;

    -- Name: actors_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.actors_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.actors_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.actors_id_seq OWNED BY public.actors.id;

    -- Name: genres; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.genres (
        id bigint NOT NULL,
        name character varying(100)
    );

    ALTER TABLE public.genres OWNER TO postgres;

    -- Name: genres_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.genres_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.genres_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.genres_id_seq OWNED BY public.genres.id;

    -- Name: movie_actors; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.movie_actors (
        movie_id bigint NOT NULL,
        actor_id bigint NOT NULL
    );

    ALTER TABLE public.movie_actors OWNER TO postgres;

    -- Name: movie_genres; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.movie_genres (
        movie_id bigint NOT NULL,
        genre_id bigint NOT NULL
    );

    ALTER TABLE public.movie_genres OWNER TO postgres;

    -- Name: movies; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.movies (
        id bigint NOT NULL,
        title character varying(255),
        description text,
        rating numeric(3,1),
        image_base64 text,
        video_url character varying(255)
    );

    ALTER TABLE public.movies OWNER TO postgres;

    -- Name: movies_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.movies_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.movies_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.movies_id_seq OWNED BY public.movies.id;

    -- Name: subscriptions; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.subscriptions (
        id bigint NOT NULL,
        user_id bigint,
        plan_type character varying(50),
        status character varying(50),
        start_date timestamp with time zone,
        end_date timestamp with time zone
    );

    ALTER TABLE public.subscriptions OWNER TO postgres;

    -- Name: subscriptions_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.subscriptions_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.subscriptions_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.subscriptions_id_seq OWNED BY public.subscriptions.id;

    -- Name: users; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.users (
        id bigint NOT NULL,
        username character varying(100),
        email character varying(100),
        password character varying(255),
        role character varying(50),
        photo_base64 text
    );

    ALTER TABLE public.users OWNER TO postgres;

    -- Name: users_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.users_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.users_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.users_id_seq OWNED BY public.users.id;

    -- Name: watchlists; Type: TABLE; Schema: public; Owner: postgres
    CREATE TABLE public.watchlists (
        id bigint NOT NULL,
        user_id bigint,
        movie_id bigint
    );

    ALTER TABLE public.watchlists OWNER TO postgres;

    -- Name: watchlists_id_seq; Type: SEQUENCE; Schema: public; Owner: postgres
    CREATE SEQUENCE public.watchlists_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    ALTER SEQUENCE public.watchlists_id_seq OWNER TO postgres;
    ALTER SEQUENCE public.watchlists_id_seq OWNED BY public.watchlists.id;

    -- Data Constraints & Foreign Keys (Disederhanakan untuk kemudahan)
    ALTER TABLE ONLY public.actors ADD CONSTRAINT actors_pkey PRIMARY KEY (id);
    ALTER TABLE ONLY public.genres ADD CONSTRAINT genres_pkey PRIMARY KEY (id);
    ALTER TABLE ONLY public.movies ADD CONSTRAINT movies_pkey PRIMARY KEY (id);
    ALTER TABLE ONLY public.users ADD CONSTRAINT users_pkey PRIMARY KEY (id);
    ALTER TABLE ONLY public.subscriptions ADD CONSTRAINT subscriptions_pkey PRIMARY KEY (id);
    ALTER TABLE ONLY public.watchlists ADD CONSTRAINT watchlists_pkey PRIMARY KEY (id);

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine # Menggunakan image standar agar script initdb berjalan otomatis
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/ # Lokasi Postgres mengeksekusi script SQL saat startup
      volumes:
        - name: init-sql
          configMap:
            name: movie-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi